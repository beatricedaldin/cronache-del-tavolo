# Tiene sveglio il progetto Supabase online: il piano gratuito lo mette in pausa
# dopo 7 giorni senza attività. Ogni 6 giorni (giorni 1, 7, 13, 19, 25 e 31 del mese,
# alle 6:00 UTC: tra un'esecuzione e l'altra non passano mai più di 6 giorni) chiama
# la funzione keepalive() (migrazione 0019), che fa una lettura senza restituire dati.
#
# Serve configurare due secret del repository (Settings > Secrets and variables > Actions):
#   SUPABASE_URL              es. https://xxxxxxxxxxxx.supabase.co
#   SUPABASE_PUBLISHABLE_KEY  la stessa chiave pubblica di .env.local
#
# Per provarlo subito: tab Actions > Supabase sveglio > Run workflow.
name: Supabase sveglio

on:
  schedule:
    - cron: "0 6 */6 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Chiama keepalive()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Mancano i secret SUPABASE_URL e SUPABASE_PUBLISHABLE_KEY." >&2
            exit 1
          fi
          # Un nuovo tentativo dopo 60 secondi: se il progetto si sta risvegliando può rispondere tardi.
          for tentativo in 1 2; do
            risposta=$(curl -sS --max-time 30 -w '\n%{http_code}' -X POST \
              "$SUPABASE_URL/rest/v1/rpc/keepalive" \
              -H "apikey: $SUPABASE_KEY" \
              -H "Content-Type: application/json" \
              -d '{}' || true)
            codice=$(echo "$risposta" | tail -n1)
            echo "Tentativo $tentativo: HTTP $codice $(echo "$risposta" | head -n1)"
            if [ "$codice" = "200" ]; then exit 0; fi
            sleep 60
          done
          echo "Supabase non risponde: controlla se il progetto è in pausa nella dashboard." >&2
          exit 1
