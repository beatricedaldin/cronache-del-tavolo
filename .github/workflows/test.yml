# Test automatici a ogni push e pull request.
# Avvia un Supabase completo in Docker, controlla le regole di visibilità (SQL)
# e prova l'app con un browser vero (telefono e computer). Se qualcosa si rompe,
# GitHub segna il commit con ❌ e ti manda un'email.
name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installa le dipendenze
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Installa il browser per i test
        run: pnpm exec playwright install --with-deps chromium

      - name: Test (Supabase locale + SQL + browser)
        run: pnpm test:e2e

      - name: Rapporto dei test
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapporto-playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Spegni Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup || true
